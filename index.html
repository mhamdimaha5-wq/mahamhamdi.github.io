<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maha Mhamdi | SFX Makeup Artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #090807;
      color: #e8e0d3;
      font-family: "Montserrat", Arial, sans-serif;
      overflow-x: hidden;
    }


    /* =========================
       NAVIGATION
       ========================= */

    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;

      padding: 31px 5.5%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      z-index: 20;
    }

    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: 4px;
      color: #e8e0d3;
      text-decoration: none;
    }

    .navigation {
      display: flex;
      align-items: center;
      gap: 31px;
    }

    .navigation a {
      position: relative;

      color: #d5cec2;
      text-decoration: none;

      font-size: 9px;
      letter-spacing: 2.2px;

      transition: .3s ease;
    }

    .navigation a::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: #7c2020;

      transition: .3s ease;
    }

    .navigation a:hover {
      color: #e8e0d3;
    }

    .navigation a:hover::after {
      width: 100%;
    }


    /* =========================
       RED DECORATIVE LINES
       ========================= */

    .red-horizontal {
      position: absolute;

      top: 111px;
      left: 5.5%;

      width: 74px;
      height: 1px;

      background: #7c2020;

      z-index: 15;
    }

    .red-vertical {
      position: absolute;

      left: 5.5%;
      bottom: 9vh;

      width: 1px;
      height: 82px;

      background: #7c2020;

      z-index: 15;
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      position: relative;

      min-height: 100vh;
      width: 100%;

      display: flex;
      align-items: flex-end;

      padding: 0 7.5% 9vh;

      overflow: hidden;

      background:
        linear-gradient(
          90deg,
          rgba(5,4,3,.78) 0%,
          rgba(5,4,3,.40) 45%,
          rgba(5,4,3,.12) 100%
        ),

        linear-gradient(
          0deg,
          rgba(5,4,3,.78) 0%,
          rgba(5,4,3,.02) 60%
        ),

        url("GOT.jpg");

      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }


    /* =========================
       HERO CONTENT
       ========================= */

    .hero-content {
      position: relative;

      z-index: 10;

      width: 100%;
      max-width: 900px;
    }


    /* LOGO */

    .lst {
      display: block;

      width: 190px;
      height: auto;

      margin-bottom: 23px;
    }


    /* SMALL TITLE */

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 14px;

      margin-bottom: 14px;

      color: #a99780;

      font-size: 9px;
      letter-spacing: 4px;

      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";

      width: 28px;
      height: 1px;

      background: #7c2020;
    }


    /* MAIN TITLE */

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;

      font-size: clamp(68px, 8.2vw, 118px);

      font-weight: 300;

      line-height: .78;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #e8e0d3;

      max-width: 920px;
    }

    h1 span {
      display: block;
    }


    /* DESCRIPTION */

    .intro {
      max-width: 445px;

      margin-top: 30px;

      color: #c4bdb2;

      font-size: 11px;

      line-height: 1.9;

      font-weight: 300;

      letter-spacing: .5px;
    }


    /* =========================
       BUTTON
       ========================= */

    .button {
      display: inline-flex;
      align-items: center;
      gap: 20px;

      margin-top: 30px;

      padding: 14px 23px;

      border: 1px solid #9d8c75;

      color: #e8e0d3;

      text-decoration: none;

      font-size: 8px;

      letter-spacing: 2.5px;

      transition: .35s ease;
    }

    .button-arrow {
      font-size: 14px;
      line-height: 1;

      transition: transform .35s ease;
    }

    .button:hover {
      background: #9d8c75;
      color: #090807;
    }

    .button:hover .button-arrow {
      transform: translateX(5px);
    }


    /* =========================
       SOCIAL ICONS
       ========================= */

    .socials {
      position: absolute;

      left: 2.3%;
      bottom: 8.5vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 17px;

      z-index: 20;
    }

    .socials a {
      width: 27px;
      height: 27px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(184,170,148,.45);

      border-radius: 50%;

      color: #d5cec2;

      text-decoration: none;

      transition: .3s ease;
    }

    .socials a svg {
      width: 12px;
      height: 12px;

      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;

      transition: .3s ease;
    }

    .socials a:hover {
      border-color: #8a2424;
      color: #b23a3a;
    }


    /* =========================
       SCROLL INDICATOR
       ========================= */

    .scroll {
      position: absolute;

      right: 5.5%;
      bottom: 6vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      color: #a9a094;

      font-size: 7px;
      letter-spacing: 3px;

      text-transform: uppercase;

      z-index: 20;
    }

    .scroll-line {
      width: 1px;
      height: 48px;

      background: #7c2020;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .top-nav {
        padding: 23px 23px;
      }

      .brand {
        font-size: 16px;
        letter-spacing: 3px;
      }

      .navigation {
        gap: 12px;
      }

      .navigation a {
        font-size: 7px;
        letter-spacing: 1px;
      }

      .navigation a:nth-child(4) {
        display: none;
      }


      .hero {
        min-height: 100svh;

        padding: 0 25px 48px;

        background-position: 60% center;
      }


      .red-horizontal {
        top: 91px;
        left: 25px;
        width: 45px;
      }

      .red-vertical {
        display: none;
      }


      .lst {
        width: 155px;
        margin-bottom: 20px;
      }


      .eyebrow {
        font-size: 7px;
        letter-spacing: 3px;

        gap: 9px;

        margin-bottom: 12px;
      }

      .eyebrow::before {
        width: 19px;
      }


      h1 {
        font-size: clamp(48px, 14vw, 70px);
        line-height: .82;
        letter-spacing: 0;
      }


      .intro {
        max-width: 90%;

        margin-top: 21px;

        font-size: 9px;
        line-height: 1.8;
      }


      .button {
        margin-top: 23px;

        padding: 12px 20px;

        font-size: 7px;
      }


      .socials,
      .scroll {
        display: none;
      }

    }

  </style>
</head>


<body>


  <!-- NAVIGATION -->

  <nav class="top-nav">

    <a href="#" class="brand">
      MAHA MHAMDI
    </a>

    <div class="navigation">

      <a href="#">HOME</a>

      <a href="#about">ABOUT</a>

      <a href="#portfolio">WORK</a>

      <a href="#behind">BEHIND THE SCENES</a>

      <a href="#contact">CONTACT</a>

    </div>

  </nav>


  <!-- RED DECORATIVE LINES -->

  <div class="red-horizontal"></div>

  <div class="red-vertical"></div>


  <!-- HERO -->

  <header class="hero">

    <div class="hero-content">

      <img
        src="lst.png"
        alt="Maha Mhamdi"
        class="lst"
      >

      <p class="eyebrow">
        SFX Makeup Artist
      </p>

      <h1>
        <span>Bringing</span>
        <span>Characters</span>
        <span>To Life</span>
      </h1>

      <p class="intro">
        Special effects makeup, prosthetics & character design.
        Creating unforgettable characters through makeup, sculpture and prosthetics.
      </p>

      <a href="#portfolio" class="button">
        VIEW MY WORK
        <span class="button-arrow">→</span>
      </a>

    </div>


    <!-- SOCIAL ICONS -->

    <div class="socials">

      <!-- INSTAGRAM -->

      <a href="#" aria-label="Instagram">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r=".8" fill="currentColor" stroke="none"></circle>
        </svg>

      </a>


      <!-- YOUTUBE -->

      <a href="#" aria-label="YouTube">

        <svg viewBox="0 0 24 24">
          <path d="M21 12s0-4-1-5-4-1-8-1-7 0-8 1-1 5-1 5 0 4 1 5 4 1 8 1 7 0 8-1 1-5 1-5z"></path>
          <path d="M10 9l5 3-5 3z"></path>
        </svg>

      </a>


      <!-- EMAIL -->

      <a href="mailto:" aria-label="Email">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="1"></rect>
          <path d="M3 7l9 7 9-7"></path>
        </svg>

      </a>

    </div>


    <!-- SCROLL -->

    <div class="scroll">

      <span>Scroll</span>

      <div class="scroll-line"></div>

    </div>

  </header>


</body>
</html>
