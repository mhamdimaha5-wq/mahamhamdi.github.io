
<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maha Mhamdi | SFX Makeup Artist</title>

  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }

    html {

      scroll-behavior: smooth;

    }

    body {

      background: #080706;

      color: #e8e1d5;

      font-family: Arial, Helvetica, sans-serif;

      overflow-x: hidden;

    }

    /* =========================

       NAVIGATION

       ========================= */

    nav {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100px;

      padding: 0 5%;

      display: flex;

      justify-content: space-between;

      align-items: center;

      z-index: 20;

    }

    .nav-logo {

      font-family: Georgia, "Times New Roman", serif;

      font-size: 17px;

      letter-spacing: 5px;

      color: #e8e1d5;

      white-space: nowrap;

    }

    .nav-links {

      display: flex;

      align-items: center;

      gap: 35px;

    }

    .nav-links a {

      position: relative;

      color: #d8d0c3;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 2.5px;

      transition: color 0.3s ease;

    }

    .nav-links a::after {

      content: "";

      position: absolute;

      left: 0;

      bottom: -8px;

      width: 0;

      height: 1px;

      background: #8a2424;

      transition: width 0.3s ease;

    }

    .nav-links a:hover {

      color: #e8e1d5;

    }

    .nav-links a:hover::after {

      width: 100%;

    }

    /* =========================

       RED DECORATIVE LINES

       ========================= */

    .red-line {

      position: absolute;

      background: #7f1d1d;

      z-index: 5;

    }

    .red-line-horizontal {

      width: 75px;

      height: 1px;

      left: 5%;

      top: 125px;

    }

    .red-line-vertical {

      width: 1px;

      height: 95px;

      left: 5%;

      bottom: 9vh;

    }

    /* =========================

       HERO

       ========================= */

    header {

      position: relative;

      width: 100%;

      min-height: 100vh;

      display: flex;

      align-items: flex-end;

      padding: 0 8% 9vh;

      background-image:

        linear-gradient(

          90deg,

          rgba(0, 0, 0, 0.88) 0%,

          rgba(0, 0, 0, 0.52) 43%,

          rgba(0, 0, 0, 0.12) 100%

        ),

        linear-gradient(

          0deg,

          rgba(0, 0, 0, 0.82) 0%,

          rgba(0, 0, 0, 0.05) 60%

        ),

        url("GOT.jpg");

      background-size: cover;

      background-position: center 15%;

      background-repeat: no-repeat;

    }

    /* =========================

       HERO CONTENT

       ========================= */

    header > div {

      position: relative;

      z-index: 10;

      max-width: 850px;

      text-align: left;

    }

    /* LOGO */

    .lst {

      width: 190px;

      height: auto;

      margin-bottom: 28px;

    }

    /* SMALL CATEGORY */

    .subtitle {

      margin-bottom: 20px;

      color: #b8aa94;

      font-size: 11px;

      letter-spacing: 5px;

      text-transform: uppercase;

    }

    /* MAIN TITLE */

    h1 {

      font-family: Georgia, "Times New Roman", serif;

      font-size: clamp(60px, 7.5vw, 105px);

      font-weight: 400;

      line-height: 0.88;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: #e8e1d5;

      max-width: 900px;

    }

    /* DESCRIPTION */

    .intro {

      margin-top: 30px;

      max-width: 470px;

      color: #c5bfb5;

      font-size: 13px;

      line-height: 1.8;

      letter-spacing: 0.3px;

    }

    /* BUTTON */

    .button {

      display: inline-flex;

      align-items: center;

      gap: 15px;

      margin-top: 32px;

      padding: 15px 30px;

      border: 1px solid #b8aa94;

      color: #e8e1d5;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 2.5px;

      transition: all 0.35s ease;

    }

    .button::after {

      content: "→";

      font-size: 15px;

      transition: transform 0.35s ease;

    }

    .button:hover {

      background: #b8aa94;

      color: #080706;

    }

    .button:hover::after {

      transform: translateX(5px);

    }

    /* =========================

       SOCIAL LINKS

       ========================= */

    .socials {

      position: absolute;

      left: 3%;

      bottom: 9vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 18px;

      z-index: 10;

    }

    .socials a {

      color: #c5bfb5;

      text-decoration: none;

      font-size: 10px;

      letter-spacing: 1px;

      writing-mode: vertical-rl;

      transition: color 0.3s ease;

    }

    .socials a:hover {

      color: #8a2424;

    }

    /* =========================

       SCROLL INDICATOR

       ========================= */

    .scroll {

      position: absolute;

      right: 5%;

      bottom: 6vh;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;

      color: #a69f94;

      font-size: 9px;

      letter-spacing: 3px;

      text-transform: uppercase;

      z-index: 10;

    }

    .scroll-line {

      width: 1px;

      height: 55px;

      background: #7f1d1d;

    }

    /* =========================

       MOBILE

       ========================= */

    @media (max-width: 700px) {

      nav {

        height: 80px;

        padding: 0 25px;

      }

      .nav-logo {

        font-size: 13px;

        letter-spacing: 3px;

      }

      .nav-links {

        gap: 13px;

      }

      .nav-links a {

        font-size: 7px;

        letter-spacing: 1px;

      }

      .nav-links a:nth-child(4) {

        display: none;

      }

      header {

        min-height: 100svh;

        padding: 0 25px 55px;

        align-items: flex-end;

        background-position: 60% center;

      }

      header > div {

        width: 100%;

        max-width: 100%;

      }

      .lst {

        width: 155px;

        margin-bottom: 20px;

      }

      .subtitle {

        font-size: 8px;

        letter-spacing: 3px;

        margin-bottom: 14px;

      }

      h1 {

        font-size: clamp(43px, 13vw, 65px);

        line-height: 0.9;

        letter-spacing: 0;

      }

      .intro {

        max-width: 90%;

        margin-top: 20px;

        font-size: 11px;

        line-height: 1.7;

      }

      .button {

        margin-top: 25px;

        padding: 13px 23px;

        font-size: 8px;

      }

      .socials {

        display: none;

      }

      .scroll {

        display: none;

      }

      .red-line-horizontal {

        width: 45px;

        left: 25px;

        top: 100px;

      }

      .red-line-vertical {

        display: none;

      }

    }

  </style>

</head>

<body>

  <!-- NAVIGATION -->

  <nav>

    <div class="nav-logo">

      MAHA MHAMDI

    </div>

    <div class="nav-links">

      <a href="#">HOME</a>

      <a href="#about">ABOUT</a>

      <a href="#portfolio">WORK</a>

      <a href="#behind">BEHIND THE SCENES</a>

      <a href="#contact">CONTACT</a>

    </div>

  </nav>

  <!-- RED DECORATION -->

  <div class="red-line red-line-horizontal"></div>

  <div class="red-line red-line-vertical"></div>

  <!-- HERO -->

  <header>

    <div>

      <img

        src="lst.png"

        alt="Maha Mhamdi"

        class="lst"

      >

      <p class="subtitle">

        SFX Makeup Artist

      </p>

      <h1>

        Bringing<br>

        Characters<br>

        To Life

      </h1>

      <p class="intro">

        Special effects makeup, prosthetics & character design.

        Creating unforgettable characters through makeup, sculpture and prosthetics.

      </p>

      <a

        href="#portfolio"

        class="button"

      >

        VIEW MY WORK

      </a>

    </div>

    <!-- SOCIALS -->

    <div class="socials">

      <a href="#" aria-label="Instagram">

        IG

      </a>

      <a href="#" aria-label="YouTube">

        YT

      </a>

      <a href="#" aria-label="Email">

        MAIL

      </a>

    </div>

    <!-- SCROLL -->

    <div class="scroll">

      <span>Scroll</span>

      <div class="scroll-line"></div>

    </div>

  </header>

</body>

</html>
