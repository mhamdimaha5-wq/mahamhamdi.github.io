<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maha Mhamdi | SFX Makeup Artist</title>

  <style>
  * {

  margin: 0;

  padding: 0;

  box-sizing: border-box;

}

body {

  background: #080808;

  color: #f5f5f5;

  font-family: Arial, sans-serif;

}

/* HERO */

header {

  min-height: 100vh;

  display: flex;

  align-items: flex-end;

  position: relative;

  padding: 80px 8%;

  background-image:

    linear-gradient(

      90deg,

      rgba(0, 0, 0, 0.85) 0%,

      rgba(0, 0, 0, 0.45) 45%,

      rgba(0, 0, 0, 0.25) 100%

    ),

    linear-gradient(

      rgba(0, 0, 0, 0.15),

      rgba(0, 0, 0, 0.65)

    ),

    url("GOT.jpg");

  background-size: cover;

  background-position: center 15%;

  background-repeat: no-repeat;

}

/* HERO CONTENT */

header > div {

  max-width: 700px;

  text-align: left;

}

/* LOGO */

.lst {

  width: 220px;

  height: auto;

  margin-bottom: 35px;

}

/* MAIN TITLE */

h1 {

  font-size: 70px;

  line-height: 0.95;

  letter-spacing: 5px;

  text-transform: uppercase;

}

/* SUBTITLE */

.subtitle {

  margin-top: 20px;

  font-size: 18px;

  letter-spacing: 5px;

  text-transform: uppercase;

  color: #b5b5b5;

}

/* DESCRIPTION */

.intro {

  margin-top: 25px;

  max-width: 500px;

  color: #d0d0d0;

  font-size: 16px;

  line-height: 1.7;

}

/* BUTTON */

.button {

  display: inline-block;

  margin-top: 35px;

  padding: 15px 32px;

  border: 1px solid #fff;

  color: #fff;

  text-decoration: none;

  letter-spacing: 2px;

  font-size: 12px;

  transition: 0.3s;

}

.button:hover {

  background: #fff;

  color: #000;

}

/* MOBILE */

@media (max-width: 700px) {

  header {

    padding: 50px 25px;

    align-items: flex-end;

    background-position: 60% center;

  }

  header > div {

    max-width: 100%;

  }

  .lst {

    width: 170px;

    margin-bottom: 25px;

  }

  h1 {

    font-size: 42px;

    letter-spacing: 3px;

  }

  .subtitle {

    font-size: 13px;

    letter-spacing: 3px;

  }

  .intro {

    font-size: 14px;

  }

}
  </style>
</head>

<body>

  <header>
    <div>
     <img src="lst.png" alt="Maha Mhamdi" class="lst">

      <p class="subtitle">SFX Makeup Artist & Character Creator</p>

      <p class="intro">
        Special effects makeup, prosthetics & character design.
      </p>

      <a href="#portfolio" class="button">VIEW MY WORK</a>
    </div>
  </header>

</body>
</html>
